<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="This page is under construction. Stay tuned for future updates."
    >

    <title>Under Construction | Developer Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="construction-page">

    <header class="site-header">
        
    </header>

    <main id="top">
        <section class="construction-content">

            <p class="construction-eyebrow">
                <span class="construction-indicator"></span>
                UPDATE COMING SOON
            </p>

            <h1>
                UNDER
                <span>CONSTRUCTION</span>
            </h1>

            <p class="construction-message">
                Thank you for your interest.
                <span>Stay tuned for future updates!</span>
            </p>

            <!-- CSS robot animation -->
            <div
                class="robot-scene"
                role="img"
                aria-label="An animated robotic arm repeatedly builds a wall from glowing violet bricks."
            >
                

                <div class="robot-workspace">

                    <!-- Completed brick wall -->
                    <div class="brick-wall" aria-hidden="true">
                        <div class="brick-row brick-row-one">
                            <span class="brick"></span>
                            <span class="brick"></span>
                            <span class="brick"></span>
                        </div>

                        <div class="brick-row brick-row-two">
                            <span class="brick"></span>
                            <span class="brick"></span>
                            <span class="brick"></span>
                        </div>

                        <div class="brick-row brick-row-three">
                            <span class="brick"></span>
                            <span class="brick"></span>
                        </div>
                    </div>

                    <!-- Robotic arm -->
                    <div class="robot-arm" aria-hidden="true">

                        <div class="robot-joint robot-joint-base"></div>

                        <div class="robot-upper-arm">
                            <div class="robot-joint robot-joint-elbow"></div>

                            <div class="robot-lower-arm">
                                <div class="robot-joint robot-joint-wrist"></div>

                                <div class="robot-gripper">
                                    <span></span>
                                    <span></span>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Brick being carried -->
                    <div class="moving-brick" aria-hidden="true"></div>

                    <!-- Robot base -->
                    <div class="robot-base" aria-hidden="true">
                        <div class="robot-base-light"></div>
                    </div>

                    <!-- Work platform -->
                    <div class="robot-platform" aria-hidden="true"></div>

                </div>

                <p class="robot-caption">
                    BUILDING SOMETHING NEW<span class="loading-dots">...</span>
                </p>
            </div>

            <a class="button button-primary construction-home" href="index.html">
                Return to homepage ↗
            </a>

        </section>
    </main>

    <footer class="construction-footer">
        <p class="construction-note">
            <span class="status-dot"></span>
            Current version is a prototype
        </p>
    </footer>

</body>
</html>
